name: Collect topic radar data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-topic-radar-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Collect topics
        run: npm run collect

      - name: Commit updated topic data
        shell: bash
        run: |
          if git diff --quiet -- data/current.json data/recent.json; then
            echo "No topic data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/recent.json
          # The Pages dashboard fetches these JSON files from GitHub at runtime.
          # Avoid spending a Pages build for each 30-minute data-only commit.
          git commit -m "[CF-Pages-Skip] chore(data): update topic radar"
          git push
